
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9f7df">
<title>♡ A Letter for Syafa ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Patrick+Hand&display=swap');

* { box-sizing: border-box; }

:root {
  --green: #4c9b76;
  --dark: #356b50;
  --pink: #f58eae;
  --cream: #fffdf6;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: 'Nunito', sans-serif;
  color: var(--dark);
  text-align: center;
  background:
    radial-gradient(ellipse at 15% 20%, #fff6df, transparent 35%),
    radial-gradient(ellipse at 90% 10%, #fbdce9, transparent 35%),
    linear-gradient(145deg, #c9f3d6, #fff3f5 55%, #fff8d9);
}

button { font: inherit; cursor: pointer; }

.page {
  width: min(900px, 100%);
  margin: auto;
  padding: 30px 16px 50px;
  position: relative;
  z-index: 1;
}

.topline {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 4px;
  color: #68977a;
}

h1 {
  font-size: clamp(40px, 8vw, 76px);
  margin: 12px 0;
  line-height: 1.1;
  animation: titleFloat 3s ease-in-out infinite;
}

h1 span { color: var(--pink); }

.subtitle {
  font: 23px 'Patrick Hand', cursive;
  color: #658b70;
}

@keyframes titleFloat {
  50% { transform: translateY(-7px); }
}

.garden {
  position: relative;
  min-height: 350px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 22px auto;
}

.envelope {
  width: min(370px, 80vw);
  height: 235px;
  position: relative;
  cursor: pointer;
  animation: envelopeFloat 3s ease-in-out infinite;
  filter: drop-shadow(0 15px 15px #4a93652a);
  transition: transform .3s;
  -webkit-tap-highlight-color: transparent;
}

.envelope:hover { transform: scale(1.04); }

.envelope:focus-visible {
  outline: 3px dashed var(--pink);
  outline-offset: 8px;
  border-radius: 18px;
}

@keyframes envelopeFloat {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -12px; }
}

.env-back {
  position: absolute;
  inset: 10px 0 0;
  border-radius: 18px;
  background: #8fd8a4;
  border: 3px solid white;
}

.paper-preview {
  position: absolute;
  top: 15px;
  left: 9%;
  right: 9%;
  height: 180px;
  background: #fffdf5;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font: 27px 'Patrick Hand', cursive;
  color: #d985a2;
  transition: top .8s;
}

.flap {
  position: absolute;
  top: 10px;
  left: 0;
  width: 100%;
  height: 145px;
  background: #bcebc6;
  clip-path: polygon(0 0, 100% 0, 50% 80%);
  transform-origin: top;
  transition: transform .8s;
  z-index: 2;
}

.env-front {
  position: absolute;
  inset: 10px 0 0;
  border-radius: 18px;
  background: #a5e5b5;
  clip-path: polygon(0 0, 50% 65%, 100% 0, 100% 100%, 0 100%);
  border: 2px solid white;
}

.seal {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 57%;
  transform: translate(-50%, -50%);
  height: 70px;
  width: 70px;
  border: 4px solid #ffb6ca;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  background: #f48bab;
  font-size: 34px;
  box-shadow: 0 4px 0 #dc7395;
  animation: heartbeat 1.4s infinite;
  transition: opacity .3s;
}

@keyframes heartbeat {
  0%, 100% { scale: 1; }
  15% { scale: 1.1; }
  30% { scale: 1; }
  45% { scale: 1.08; }
}

.envelope.open .flap { transform: rotateX(180deg); }
.envelope.open .seal { opacity: 0; }
.envelope.open .paper-preview { top: -35px; }

.tap {
  position: absolute;
  bottom: -3px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  border: 2px dashed #f39ab7;
  padding: 10px 17px;
  border-radius: 40px;
  white-space: nowrap;
  font: 19px 'Patrick Hand', cursive;
}

.frog-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 8px auto 25px;
}

.frog {
  border: 0;
  background: transparent;
  font-size: 62px;
  animation: frogBounce 1.8s ease-in-out infinite;
}

@keyframes frogBounce {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -10px; }
}

.bubble {
  max-width: 260px;
  background: white;
  border: 2px solid #b7e5c4;
  border-radius: 20px;
  padding: 12px 15px;
  font: 18px 'Patrick Hand', cursive;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 24px 0;
}

.btn {
  border: 0;
  border-radius: 40px;
  padding: 13px 22px;
  font-weight: 900;
  box-shadow: 0 5px 0 #00000012;
  transition: transform .2s;
}

.btn:hover { transform: translateY(-3px); }
.btn-green { background: #56a77e; color: white; }
.btn-white { background: white; color: #4c916d; }
.btn-pink { background: #f69bb7; color: white; }

.footer {
  color: #7c9d82;
  font: 18px 'Patrick Hand', cursive;
}

.music-status {
  display: inline-block;
  background: #ffffffbb;
  border-radius: 25px;
  padding: 8px 15px;
  font-size: 13px;
}

.particle {
  position: fixed;
  top: -35px;
  left: var(--x);
  z-index: 0;
  pointer-events: none;
  animation: fall var(--duration) linear forwards;
  font-size: var(--size);
  opacity: .8;
}

@keyframes fall {
  0% { transform: translate(0, -10vh) rotate(0); }
  100% { transform: translate(var(--drift), 115vh) rotate(420deg); }
}

.backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #204c38d9;
  backdrop-filter: blur(8px);
}

.backdrop.show { display: block; }

.letter {
  display: none;
  position: fixed;
  z-index: 11;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(680px, calc(100vw - 26px));
  max-height: 82vh;
  overflow-y: auto;
  text-align: left;
  padding: 25px;
  background: var(--cream);
  border: 4px solid white;
  border-radius: 24px;
  box-shadow: 0 12px 0 #cdebd7, 0 25px 70px #163b2b66;
  line-height: 1.9;
  overscroll-behavior: contain;
}

.letter.show {
  display: block;
  animation: letterIn .65s ease both;
}

@keyframes letterIn {
  from { opacity: 0; transform: translate(-50%, -45%) scale(.9); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.close {
  float: right;
  position: sticky;
  top: 0;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: #ffe1eb;
  color: #b76180;
  font-size: 24px;
}

.letter-line { margin: 12px 0; white-space: pre-wrap; }
.letter-line.head { color: #df82a0; font-weight: 900; }

.letter-line.big {
  font: 30px 'Patrick Hand', cursive;
  color: #429569;
  background: #e8f8e9;
  padding: 13px;
  text-align: center;
  border-radius: 14px;
}

.letter-line.sign {
  text-align: right;
  font: 22px 'Patrick Hand', cursive;
}

.letter-line.ps { text-align: center; color: #d87c9c; }

body.modal-open { overflow: hidden; }

@media (max-width: 480px) {
  .garden { min-height: 315px; }
  .envelope { height: 205px; }
  .paper-preview { height: 160px; }
  .letter { padding: 20px; }
  .letter-line.big { font-size: 26px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main class="page">
  <div class="topline">♡ A TINY LOVE LETTER ♡</div>

  <h1>hi, <span>sayangkuuu</span> 🤍</h1>
  <p class="subtitle">ada sesuatu yang manis khusus buat kamu...</p>

  <section class="garden">
    <div class="envelope" id="envelope" role="button" tabindex="0"
         aria-label="Buka surat">
      <div class="env-back"></div>
      <div class="paper-preview">buat kamu ♡</div>
      <div class="flap"></div>
      <div class="env-front"></div>
      <div class="seal">♥</div>
    </div>
    <div class="tap">☝️ tappp amplopnyaaa, cutie! 💌</div>
  </section>

  <div class="frog-area">
    <button class="frog" id="frog" aria-label="Klik kodok">🐸</button>
    <div class="bubble" id="bubble">
      halooww, pak pos kodok datang bawa surat! 📨
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-green" id="openBtn">💌 buka surat</button>
    <button class="btn btn-white" id="musicBtn">♫ nyalakan musik</button>
    <button class="btn btn-pink" id="resetBtn">↻ mulai lagi</button>
  </div>

  <div class="music-status" id="musicStatus">
    🎵 musik: menceritakanmu.mp3
  </div>
  <p>🤍 dibuat dengan banyak cinta dan sedikit bantuan kodok 🐸</p>
  <p class="footer">made with ♥ by Khafi · for Syafa only</p>
</main>

<div class="backdrop" id="backdrop"></div>

<article class="letter" id="letter" aria-label="Surat cinta">
  <button class="close" id="closeBtn" aria-label="Tutup surat">×</button>
  <div id="letterContent"></div>
</article>

<!-- Pastikan MP3 berada di folder yang sama dengan index.html -->
<audio id="music" src="./menceritakanmu.mp3"
       loop preload="auto" playsinline></audio>

<script>
const $ = id => document.getElementById(id);

const letterLines = [
  ['head', 'untuk cewekuuu tersayangg, Syafa Salma Aulia🤍🤍,'],
  ['p', 'haaiii sayanggku... bingung yaa ada apaa? ini ada suratt buat kamuu, suratt inii sederhanaa, tapiii isinyaa semua hall yangg selamaa inii sulittt bangett akuu ucapkann.'],
  ['big', 'akuuu banggaaa bangettt punyaa kamuuu:>.'],
  ['p', 'banggaaa padaa caramuu tersenyumm maniss di hari yang berat, padaa hatimuu yang sangatt lembuttt, dan padaaa semuaa usahaa yang kamuuu lakukann diam-diam.'],
  ['p', 'timaacii yaaa sayanggg sudaa jadi rumaa tempattkuu pulangg, dan alasankuu inginn jadii lebih baikkk setiapp harii.'],
  ['p', 'apaa pun yang terjadii, akuuu selaluu adaa di sisimuuu.'],
  ['sign', 'dengan seluruh cinta,'],
  ['sign', 'Muhammad Khafi Rabbani'],
  ['ps', 'kalauuu sekarangg kamuu senyum-senyumm sendirii, berarti suratnyaa berhasil. hehe ♡']
];

let opened = false;
let runId = 0;
let musicStarted = false;

function makeParticles() {
  const symbols = ['🤍', '🌸', '🌷', '✨', '🍃', '💕'];
  const p = document.createElement('span');
  p.className = 'particle';
  p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  p.style.setProperty('--x', Math.random() * 100 + 'vw');
  p.style.setProperty('--size', (12 + Math.random() * 15) + 'px');
  p.style.setProperty('--duration', (6 + Math.random() * 7) + 's');
  p.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 14000);
}

setInterval(makeParticles, 650);

function wait(ms, id) {
  return new Promise(resolve => {
    setTimeout(() => resolve(id === runId), ms);
  });
}

function typeText(el, text, speed, id) {
  return new Promise(resolve => {
    let i = 0;
    function next() {
      if (id !== runId || i >= text.length) return resolve();
      el.textContent += text[i++];
      $('letter').scrollTop = $('letter').scrollHeight;
      setTimeout(next, speed);
    }
    next();
  });
}

/*
 * Dipanggil langsung dari klik/tap pengguna.
 * Pemanggilan play() dilakukan sebelum animasi dan await,
 * agar tetap berada dalam konteks interaksi pengguna.
 */
function startMusicFromTap() {
  const music = $('music');

  if (!music.paused) {
    musicStarted = true;
    return;
  }

  const playAttempt = music.play();

  if (playAttempt && typeof playAttempt.then === 'function') {
    playAttempt.then(() => {
      musicStarted = true;
      $('musicBtn').textContent = '♫ matikan musik';
      $('musicStatus').textContent = '🎵 musik sedang diputar 💚';
    }).catch(() => {
      musicStarted = false;
      $('musicStatus').textContent =
        'Musik belum mulai. Tekan tombol ♫ nyalakan musik.';
      $('musicBtn').textContent = '♫ nyalakan musik';
    });
  }
}

async function openLetter() {
  // Mulai musik pada sentuhan yang sama dengan pembukaan amplop.
  startMusicFromTap();

  if (opened) return;
  opened = true;
  const id = ++runId;

  $('envelope').classList.add('open');
  $('letterContent').innerHTML = '';
  $('backdrop').classList.add('show');
  $('letter').classList.add('show');
  document.body.classList.add('modal-open');
  $('openBtn').textContent = '💗 surat terbuka';

  await wait(400, id);

  for (const [kind, text] of letterLines) {
    if (id !== runId) return;

    const p = document.createElement('p');
    p.className = 'letter-line ' + kind;
    $('letterContent').appendChild(p);

    await typeText(p, text, kind === 'big' ? 75 : 48, id);
    if (id !== runId) return;
    if (!await wait(kind === 'sign' ? 850 : 650, id)) return;
  }

  $('bubble').textContent =
    'suratnya selesai! semoga kamu senyum yaa 💗';
}

function closeLetter() {
  ++runId;
  $('letter').classList.remove('show');
  $('backdrop').classList.remove('show');
  document.body.classList.remove('modal-open');
  // Musik tetap berjalan saat surat ditutup.
}

function resetLetter() {
  closeLetter();
  opened = false;
  $('envelope').classList.remove('open');
  $('letterContent').innerHTML = '';
  $('openBtn').textContent = '💌 buka surat';

  $('bubble').textContent =
    'pssst... pak pos kodok datang bawa surat! 📨';

  $('music').pause();
  $('music').currentTime = 0;
  musicStarted = false;
  $('musicBtn').textContent = '♫ nyalakan musik';
  $('musicStatus').textContent = '🎵 musik: menceritakanmu.mp3';
}

$('envelope').addEventListener('click', openLetter);

$('envelope').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    openLetter();
  }
});

$('openBtn').addEventListener('click', openLetter);
$('resetBtn').addEventListener('click', resetLetter);
$('closeBtn').addEventListener('click', closeLetter);
$('backdrop').addEventListener('click', closeLetter);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLetter();
});

$('frog').addEventListener('click', () => {
  const messages = [
    'kamu lucu banget sih! 🐸💕',
    'surat rahasia khusus buat Syafa!',
    'jangan lupa senyum hari ini 🌷',
    'kodoknya ikut salting hehe 💗',
    'semoga harimu semanis stroberi 🍓'
  ];

  $('bubble').textContent =
    messages[Math.floor(Math.random() * messages.length)];

  $('frog').animate([
    { transform: 'translateY(0) rotate(0)' },
    { transform: 'translateY(-28px) rotate(-12deg)' },
    { transform: 'translateY(0) rotate(0)' }
  ], { duration: 550, easing: 'ease-out' });
});

$('musicBtn').addEventListener('click', async () => {
  const music = $('music');

  try {
    if (music.paused) {
      await music.play();
      musicStarted = true;
      $('musicBtn').textContent = '♫ matikan musik';
      $('musicStatus').textContent = '🎵 musik sedang diputar 💚';
    } else {
      music.pause();
      musicStarted = false;
      $('musicBtn').textContent = '♫ nyalakan musik';
      $('musicStatus').textContent = '🎵 musik dijeda';
    }
  } catch (error) {
    $('musicStatus').textContent =
      'Musik gagal diputar. Pastikan file menceritakanmu.mp3 tersedia.';
  }
});

$('music').addEventListener('error', () => {
  $('musicStatus').textContent =
    'File musik tidak ditemukan. Periksa nama file MP3 di GitHub.';
});
</script>
</body>
</html>
